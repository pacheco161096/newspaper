services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hola_vallarta
      POSTGRES_USER: hola_vallarta
      POSTGRES_PASSWORD: hola_vallarta_local
    ports:
      - "5432:5432"
    volumes:
      - hola_vallarta_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hola_vallarta -d hola_vallarta"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hola_vallarta_postgres:
